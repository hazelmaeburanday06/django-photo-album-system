{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="fw-bold">
        {{ album.title }}
    </h1>

    <div>

        <a href="{% url 'photo-upload' album.id %}"
           class="btn btn-success me-2">

            Upload Photo

        </a>

        <a href="{% url 'album-update' album.id %}"
           class="btn btn-warning me-2">

            Edit

        </a>

        <a href="{% url 'album-delete' album.id %}"
           class="btn btn-danger">

            Delete

        </a>

    </div>

</div>

<div class="row">

    {% for photo in photos %}

    <div class="col-md-4 mb-4">

        <div class="card album-card">

            <img src="{{ photo.image.url }}"
                 class="card-img-top album-image">
                 

            <div class="card-body">

                <p class="text-muted">
                    {{ photo.caption }}
                </p>

            </div>

        </div>

    </div>

    {% empty %}

    <p>No photos uploaded yet.</p>

    {% endfor %}

</div>

{% endblock %}
