{% extends 'base.html' %}

{% block content %}

<h1 class="fw-bold mb-4">
    {{ album.title }}
</h1>

<div class="row">

    {% for photo in photos %}

    <div class="col-md-4 mb-4">

        <div class="card album-card">

            <img src="{{ photo.image.url }}"
                 class="card-img-top album-image">

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
