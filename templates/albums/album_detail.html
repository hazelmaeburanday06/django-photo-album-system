{% extends 'base.html' %}

{% block content %}

<div class="card p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center">

        <div>

            <h1 class="fw-bold">
                {{ object.title }}
            </h1>

            <p>
                {{ object.description }}
            </p>

        </div>

        <div>

            <a
                href="{% url 'album-update' object.pk %}"
                class="btn btn-warning btn-custom"
            >
                Edit
            </a>

            <a
                href="{% url 'album-delete' object.pk %}"
                class="btn btn-danger btn-custom"
            >
                Delete
            </a>

            <a
                href="{% url 'photo-upload' object.pk %}"
                class="btn btn-success btn-custom"
            >
                Upload Photo
            </a>

        </div>

    </div>

</div>

<div class="photo-grid">

    {% for photo in object.photos.all %}

        <div class="card photo-card p-3">

            <img
                src="{{ photo.image.url }}"
                alt="photo"
            >

            <div class="mt-3">

                <h5>
                    {{ photo.caption }}
                </h5>

            </div>

        </div>

    {% empty %}

        <p>No photos uploaded.</p>

    {% endfor %}

</div>

{% endblock %}
