{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="form-card">
        <h1>Upload Photo</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-save">
                Upload Photo
            </button>
        </form>
    </div>

</div>

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.form-card{
    background:white;
    padding:40px;
    width:500px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.form-card h1{
    text-align:center;
    margin-bottom:30px;
}

.form-card p{
    margin-bottom:20px;
}

.form-card input,
.form-card select,
.form-card textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
}

.btn-save{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn-save:hover{
    background:#1d4ed8;
}

</style>

{% endblock %}
