{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card p-4">

            <h2 class="fw-bold mb-4 text-center">
                Upload Photo
            </h2>

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success w-100 btn-custom">
                    Upload
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
