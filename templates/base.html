{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Album</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar{
            background: linear-gradient(90deg,#4e54c8,#8f94fb);
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            font-weight:bold;
        }

        .album-card{
            border:none;
            border-radius:15px;
            overflow:hidden;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .album-card:hover{
            transform:translateY(-5px);
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .album-image{
            height:250px;
            object-fit:cover;
        }

        .btn-custom{
            background:#4e54c8;
            color:white;
            border:none;
        }

        .btn-custom:hover{
            background:#3d42a4;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="/">
            📸 Photo Album
        </a>

        <div class="ms-auto">

            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="btn btn-light">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-light me-2">
                    Login
                </a>

                <a href="{% url 'signup' %}" class="btn btn-warning">
                    Signup
                </a>
            {% endif %}

        </div>
    </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
