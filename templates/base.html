<!DOCTYPE html>
<html>
<head>
    <title>Photo Album</title>
</head>
<body>
    <h1>Photo Album Management System</h1>

    {% if user.is_authenticated %}
        <p>Welcome {{ user.username }}</p>
        <a href="/accounts/logout/">Logout</a>
    {% else %}
        <a href="/accounts/login/">Login</a>
    {% endif %}

    <hr>

    {% block content %}{% endblock %}
</body>
</html>
