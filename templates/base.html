<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photo Album</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(
                to right,
                #4f46e5,
                #7c3aed
            );
        }

        .navbar-brand {
            color: white !important;
            font-size: 26px;
            font-weight: bold;
        }

        .welcome-text {
            color: white;
            margin-right: 15px;
        }

        .main-container {
            margin-top: 40px;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-custom {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: bold;
        }

        .photo-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 20px;
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            📸 Photo Album
        </a>

        <div>

            {% if user.is_authenticated %}

                <span class="welcome-text">
                    Welcome {{ user.username }}
                </span>

                <form
                    method="POST"
                    action="{% url 'logout' %}"
                    style="display:inline;"
                >

                    {% csrf_token %}

                    <button class="btn btn-light btn-custom">
                        Logout
                    </button>

                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-light btn-custom"
                >
                    Login
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container main-container">

    {% block content %}

    {% endblock %}

</div>

</body>
</html>
